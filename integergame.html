```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integer Comparison Game</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    .game-container {
        width: min(900px, 94%);
        margin: 30px auto;
        background: white;
        border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.12);
        overflow: hidden;
    }

    /* Tabs */
    .tabs {
        display: flex;
        background: #e5e8ec;
        border-bottom: 2px solid #bbb;
    }

    .tab {
        flex: 1;
        padding: 14px 20px;
        font-size: 18px;
        font-weight: bold;
        background: #e5e8ec;
        border: none;
        cursor: pointer;
    }

    .tab.active {
        background: white;
    }

    .tab:hover:not(.active) {
        background: #d9dde2;
    }

    .game-content {
        padding: 35px 30px 45px;
        text-align: center;
    }

    /* Score */
    .scoreboard {
        display: flex;
        justify-content: center;
        gap: 60px;
        margin-bottom: 30px;
        font-size: 22px;
        font-weight: bold;
    }

    .score-number,
    .streak-number {
        font-size: 30px;
    }

    /* Prompt */
    .prompt {
        font-size: 32px;
        font-weight: bold;
        margin: 20px 0 30px;
    }

    /* Answer choices */
    .options {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 80px;
        margin: 15px 0 50px;
    }

    .answer-button {
        min-width: 220px;
        min-height: 110px;
        padding: 15px 22px;
        font-size: 52px;
        font-weight: bold;
        border: 4px solid #333;
        border-radius: 14px;
        background: #fff;
        cursor: pointer;
        transition: transform 0.1s, background-color 0.1s;
    }

    .answer-button:hover:not(:disabled) {
        background: #eef4ff;
        transform: scale(1.04);
    }

    .answer-button:active:not(:disabled) {
        transform: scale(0.98);
    }

    .answer-button:disabled {
        cursor: default;
        color: #222;
        opacity: 1;
    }

    .answer-button.correct {
        background-color: #c9f7c5;
    }

    .answer-button.incorrect {
        background-color: #f7c5c5;
    }

    /* Number line */
    .number-line-container {
        width: min(700px, 95%);
        margin: 20px auto 0;
    }

    .number-line {
        position: relative;
        height: 80px;
        margin: 0 25px;
    }

    .line {
        position: absolute;
        left: 0;
        right: 0;
        top: 22px;
        height: 4px;
        background: #222;
    }

    .ticks {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
    }

    .tick-container {
        width: 1px;
        position: relative;
        text-align: center;
    }

    .tick {
        position: absolute;
        top: 10px;
        left: -2px;
        width: 4px;
        height: 25px;
        background: #222;
    }

    .tick-label {
        position: absolute;
        top: 42px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 18px;
        font-weight: bold;
    }

    .direction-labels {
        display: flex;
        justify-content: space-between;
        margin-top: 5px;
        font-size: 20px;
        font-weight: bold;
    }

    .feedback {
        height: 36px;
        margin-top: 25px;
        font-size: 24px;
        font-weight: bold;
    }

    .hidden {
        display: none;
    }

    @media (max-width: 700px) {
        .options {
            gap: 25px;
        }

        .answer-button {
            min-width: 145px;
            min-height: 95px;
            padding: 10px;
            font-size: 34px;
        }

        .prompt {
            font-size: 26px;
        }

        .scoreboard {
            gap: 30px;
        }

        .tab {
            font-size: 15px;
            padding: 12px 8px;
        }
    }
</style>
</head>

<body>

<div class="game-container">

    <div class="tabs">
        <button class="tab active" id="tab1Button" onclick="switchTab(1)">
            Compare Integers
        </button>

        <button class="tab" id="tab2Button" onclick="switchTab(2)">
            Comparing Sums and Differences
        </button>
    </div>


    <!-- =========================
         TAB 1
    ========================== -->

    <div class="game-content" id="tab1">

        <div class="scoreboard">
            <div>
                Score:
                <span class="score-number shared-score">0</span>
            </div>

            <div>
                Streak:
                <span class="streak-number shared-streak">0</span>
            </div>
        </div>

        <div class="prompt" id="prompt1">
            Click on the lesser integer
        </div>

        <div class="options">
            <button class="answer-button" id="integer1"></button>
            <button class="answer-button" id="integer2"></button>
        </div>

        <div class="number-line-container">
            <div class="number-line">
                <div class="line"></div>
                <div class="ticks number-line-ticks"></div>
            </div>

            <div class="direction-labels">
                <span>&lt;-- lesser</span>
                <span>greater --&gt;</span>
            </div>
        </div>

        <div class="feedback" id="feedback1"></div>

    </div>


    <!-- =========================
         TAB 2
    ========================== -->

    <div class="game-content hidden" id="tab2">

        <div class="scoreboard">
            <div>
                Score:
                <span class="score-number shared-score">0</span>
            </div>

            <div>
                Streak:
                <span class="streak-number shared-streak">0</span>
            </div>
        </div>

        <div class="prompt" id="prompt2">
            Click on the lesser expression
        </div>

        <div class="options">
            <button class="answer-button" id="expression1"></button>
            <button class="answer-button" id="expression2"></button>
        </div>

        <div class="number-line-container">
            <div class="number-line">
                <div class="line"></div>
                <div class="ticks number-line-ticks"></div>
            </div>

            <div class="direction-labels">
                <span>&lt;-- lesser</span>
                <span>greater --&gt;</span>
            </div>
        </div>

        <div class="feedback" id="feedback2"></div>

    </div>

</div>


<script>

/* ==========================================================
   SHARED SCORE
========================================================== */

let score = 0;
let streak = 0;
let answering = false;

function updateScoreboard() {

    document.querySelectorAll(".shared-score").forEach(function(element) {
        element.textContent = score;
    });

    document.querySelectorAll(".shared-streak").forEach(function(element) {
        element.textContent = streak;
    });
}


/* ==========================================================
   NUMBER LINES
========================================================== */

function createNumberLines() {

    document.querySelectorAll(".number-line-ticks").forEach(function(ticks) {

        ticks.innerHTML = "";

        for (let i = -5; i <= 5; i++) {

            const container = document.createElement("div");
            container.className = "tick-container";

            const tick = document.createElement("div");
            tick.className = "tick";

            const label = document.createElement("div");
            label.className = "tick-label";
            label.textContent = i;

            container.appendChild(tick);
            container.appendChild(label);

            ticks.appendChild(container);
        }
    });
}


/* ==========================================================
   TAB SWITCHING
========================================================== */

function switchTab(tabNumber) {

    if (answering) {
        return;
    }

    document.getElementById("tab1").classList.toggle(
        "hidden",
        tabNumber !== 1
    );

    document.getElementById("tab2").classList.toggle(
        "hidden",
        tabNumber !== 2
    );

    document.getElementById("tab1Button").classList.toggle(
        "active",
        tabNumber === 1
    );

    document.getElementById("tab2Button").classList.toggle(
        "active",
        tabNumber === 2
    );
}


/* ==========================================================
   GENERAL ANSWER FEEDBACK
========================================================== */

function processAnswer(isCorrect, clickedButton, feedbackElement, nextQuestion) {

    if (answering) {
        return;
    }

    answering = true;

    const allAnswerButtons = document.querySelectorAll(".answer-button");

    allAnswerButtons.forEach(function(button) {
        button.disabled = true;
    });


    if (isCorrect) {

        score++;
        streak++;

        clickedButton.classList.add("correct");
        feedbackElement.textContent = "✓ Correct!";

    } else {

        score--;
        streak = 0;

        clickedButton.classList.add("incorrect");
        feedbackElement.textContent = "✗ Incorrect";
    }

    updateScoreboard();


    setTimeout(function() {

        clickedButton.classList.remove("correct", "incorrect");

        feedbackElement.textContent = "";

        allAnswerButtons.forEach(function(button) {
            button.disabled = false;
        });

        nextQuestion();

        answering = false;

    }, 600);
}


/* ==========================================================
   TAB 1 — COMPARE INTEGERS
========================================================== */

let firstInteger;
let secondInteger;
let requestType1;


function randomMagnitude() {
    return Math.floor(Math.random() * 11) + 10;
}


function generateIntegersTab1() {

    const probability = Math.random();

    let sign1;
    let sign2;


    if (probability < 0.24) {

        // Both positive: 24%
        sign1 = 1;
        sign2 = 1;

    } else if (probability < 0.64) {

        // Both negative: 40%
        sign1 = -1;
        sign2 = -1;

    } else {

        // Mixed signs: 36%

        if (Math.random() < 0.5) {
            sign1 = 1;
            sign2 = -1;
        } else {
            sign1 = -1;
            sign2 = 1;
        }
    }


    let magnitude1 = randomMagnitude();
    let magnitude2 = randomMagnitude();

    firstInteger = sign1 * magnitude1;
    secondInteger = sign2 * magnitude2;


    while (firstInteger === secondInteger) {

        magnitude2 = randomMagnitude();
        secondInteger = sign2 * magnitude2;
    }


    // Randomize left/right position
    if (Math.random() < 0.5) {

        const temp = firstInteger;
        firstInteger = secondInteger;
        secondInteger = temp;
    }
}


function newQuestionTab1() {

    generateIntegersTab1();

    document.getElementById("integer1").textContent = firstInteger;
    document.getElementById("integer2").textContent = secondInteger;


    if (Math.random() < 0.5) {

        requestType1 = "lesser";

        document.getElementById("prompt1").textContent =
            "Click on the lesser integer";

    } else {

        requestType1 = "greater";

        document.getElementById("prompt1").textContent =
            "Click on the greater integer";
    }
}


function checkIntegerAnswer(selectedInteger, clickedButton) {

    let correctAnswer;

    if (requestType1 === "lesser") {
        correctAnswer = Math.min(firstInteger, secondInteger);
    } else {
        correctAnswer = Math.max(firstInteger, secondInteger);
    }


    processAnswer(
        selectedInteger === correctAnswer,
        clickedButton,
        document.getElementById("feedback1"),
        newQuestionTab1
    );
}


document.getElementById("integer1").addEventListener("click", function() {
    checkIntegerAnswer(firstInteger, this);
});

document.getElementById("integer2").addEventListener("click", function() {
    checkIntegerAnswer(secondInteger, this);
});


/* ==========================================================
   TAB 2 — COMPARE SUMS AND DIFFERENCES
========================================================== */

let expressionValue1;
let expressionValue2;
let requestType2;


/* Random integer from -8 through 8 */
function randomSmallInteger() {
    return Math.floor(Math.random() * 17) - 8;
}


/* Generate two distinct integers */
function generateDistinctPair() {

    let a = randomSmallInteger();
    let b = randomSmallInteger();

    while (a === b) {
        b = randomSmallInteger();
    }

    return [a, b];
}


/* Format an expression.

   Examples:

   5 + 3
   5 + (-3)
   5 − 3
   5 − (-3)
*/

function formatExpression(a, b, operator) {

    let secondNumber;

    if (b < 0) {
        secondNumber = "(" + b + ")";
    } else {
        secondNumber = b;
    }

    return a + " " + operator + " " + secondNumber;
}


function generateExpressions() {

    let a, b, c, d;
    let operator1, operator2;

    // Keep generating the entire problem until
    // the two expressions have different values.
    do {

        // First pair: two distinct integers
        a = randomSmallInteger();
        b = randomSmallInteger();

        while (b === a) {
            b = randomSmallInteger();
        }


        // Second pair: two distinct integers
        c = randomSmallInteger();
        d = randomSmallInteger();

        while (d === c) {
            d = randomSmallInteger();
        }


        // Randomly choose + or − for each expression
        operator1 = Math.random() < 0.5 ? "+" : "−";
        operator2 = Math.random() < 0.5 ? "+" : "−";


        // Calculate A
        if (operator1 === "+") {
            expressionValue1 = a + b;
        } else {
            expressionValue1 = a - b;
        }


        // Calculate B
        if (operator2 === "+") {
            expressionValue2 = c + d;
        } else {
            expressionValue2 = c - d;
        }


        // If A === B, EVERYTHING above is generated again.

    } while (expressionValue1 === expressionValue2);


    // Display the expressions only after we know A ≠ B
    document.getElementById("expression1").textContent =
        formatExpression(a, b, operator1);

    document.getElementById("expression2").textContent =
        formatExpression(c, d, operator2);
}

function newQuestionTab2() {

    generateExpressions();


    if (Math.random() < 0.5) {

        requestType2 = "lesser";

        document.getElementById("prompt2").textContent =
            "Click on the lesser expression";

    } else {

        requestType2 = "greater";

        document.getElementById("prompt2").textContent =
            "Click on the greater expression";
    }
}


function checkExpressionAnswer(clickedSide, clickedButton) {

    let correctSide;

    // expressionValue1 = A (left expression)
    // expressionValue2 = B (right expression)

    if (requestType2 === "lesser") {

        // If A < B, click A.
        // If A > B, click B.
        if (expressionValue1 < expressionValue2) {
            correctSide = "left";
        } else {
            correctSide = "right";
        }

    } else {

        // GREATER:
        // If A > B, click A.
        // If A < B, click B.
        if (expressionValue1 > expressionValue2) {
            correctSide = "left";
        } else {
            correctSide = "right";
        }
    }

    processAnswer(
        clickedSide === correctSide,
        clickedButton,
        document.getElementById("feedback2"),
        newQuestionTab2
    );
}


document.getElementById("expression1").addEventListener("click", function() {
    checkExpressionAnswer("left", this);
});

document.getElementById("expression2").addEventListener("click", function() {
    checkExpressionAnswer("right", this);
});


document.getElementById("expression1").addEventListener("click", function() {
    checkExpressionAnswer(expressionValue1, this);
});

document.getElementById("expression2").addEventListener("click", function() {
    checkExpressionAnswer(expressionValue2, this);
});


/* ==========================================================
   START GAME
========================================================== */

createNumberLines();
updateScoreboard();

newQuestionTab1();
newQuestionTab2();

</script>

</body>
</html>
